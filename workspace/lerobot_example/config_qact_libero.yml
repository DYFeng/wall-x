# Training Configuration for Wall-X Robotic Multi-Modal Learning
# This configuration supports multi-modal learning with vision, language, and action data

# Model and paths configuration
log_name: "wall-oss freeze_vlm lr1e-5 batch2 grad16"
log_project: "wall_oss_libero"
model_type: wall-oss
pretrained_wallx_path: "/root/gpufree-data/models/x-square-robot/wall-oss-flow-v0.1/"  # Must set
processor_path: "/root/gpufree-data/models/x-square-robot/wall-oss-flow-v0.1/"
save_path: "/root/gpufree-data/output/train/libero_all/ckpt/"                # Must set
use_fast_tokenizer: False                       # True: train FAST, False: train Flow
action_tokenizer_path: "/path/to/fast/"         # Must set if use_fast_tokenizer is true

# Torch Profile
profile: False
profile_save_path: /path/to/profile/
profile_wait_iters: 10
profile_warmup_iters: 5
profile_active_iters: 2

# Training hyperparameters
num_warmup_steps: 100
num_training_steps: 20
learning_rate: 0.00005
min_lr: 0.00001
num_epoch: 100
gradient_accumulation_steps: 1
batch_size_per_gpu: 1
padding_side: left
epoch_save_interval: 1
val_interval: 500  # Validate every 1000 iterations

