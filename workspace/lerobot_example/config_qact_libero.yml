# LoRA configuration
use_lora: true
lora_r: 8
lora_alpha: 24
lora_dropout: 0.1
lora_target_modules:
  - "k_proj_experts.0"
  - "v_proj_experts.0"
  - "o_proj_experts.0"
  - "q_proj_experts.1"
  - "k_proj_experts.1"
  - "v_proj_experts.1"
  - "o_proj_experts.1"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# Training optimization settings
FSDP2: false
torch_compile: false # 这个不能为true，貌似跟lora会有冲突，加载模型时key找不到

# Robot configuration - Define degrees of freedom for each component
dof_config:
  master_right_ee_cartesian_pos: 3
  master_right_ee_rotation: 3
  master_right_gripper: 1

# Agent proprioception configuration (typically matches DOF config)
agent_pos_config:
  follow_right_ee_cartesian_pos: 3
  follow_right_ee_rotation: 3
  follow_right_gripper: 1

# Checkpoint resuming configuration
# resume:
#   ckpt: "/root/gpufree-data/output/train/libero_all/ckpt/0"
#   # load_ckpt_only: true

norm_stats_path: "/root/gpufree-data/output/train/libero_all/action_stats/all_robots_action_stats.json"

enable_customized_robot_config: true
customized_robot_config:
  name: "libero_all"
  customized_dof_config:
    "action_all": 7
  customized_agent_pos_config:
    "state_all": 7

# Data configuration
data:
  use_lerobot: true

  # LeRobot dataset configuration
  lerobot_config:
    repo_id: "x-square-robot/libero_all"
    root: "/root/gpufree-data/datasets/x-square-robot/libero_all"
    episodes: null
    image_transforms: null
    delta_timestamps: null
    tolerance_s: 1e-4
    revision: null
    force_cache_sync: false
    download_videos: true
    video_backend: null

  action_horizon: 10
  train_test_split: 0.001

  # Action keys for observation and prediction
  obs_action_keys:
    - follow_right_ee_cartesian_pos
    - follow_right_ee_rotation
    - follow_right_gripper

  predict_action_keys:
    - master_right_ee_cartesian_pos
    - master_right_ee_rotation
    - master_right_gripper

  # Image resolution configuration for different camera views
  resolution:
    face_view: 224
    left_wrist_view: 224
    right_wrist_view: 224
    move1_view: 224
    move2_view: 224
    top_view: 224
    wall_view: 224
    multi_modal: 224

