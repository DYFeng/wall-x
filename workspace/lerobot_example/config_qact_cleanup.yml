# Training Configuration for Wall-X Robotic Multi-Modal Learning
# This configuration supports multi-modal learning with vision, language, and action data

# Model and paths configuration
log_name: "qwen2_5 lr1e-5 batch12 grad2"
log_project: "wall_oss_so101"
model_type: qwen2_5
pretrained_wallx_path: "/root/gpufree-data/models/x-square-robot/wall-oss-flow-v0.1/"  # Must set
processor_path: "/root/gpufree-data/models/x-square-robot/wall-oss-flow-v0.1/"
save_path: "/root/gpufree-data/output/train/so101-table-cleanup/ckpt/"                # Must set
use_fast_tokenizer: False                       # True: train FAST, False: train Flow
action_tokenizer_path: "/path/to/fast/"         # Must set if use_fast_tokenizer is true
# 代码里面居然有两套注意力机制。
# 当 config.attention_moe 为 True 时，使用 JOINT_QWEN_ATTENTION_CLASSES 作为注意力机制。MoE (Mixture of Experts) 注意力机制 ：使用 model.layers.12.self_attn.k_proj_experts.0.weight 等权重
# 否则，使用 QWEN2_5_VL_ATTENTION_CLASSES 作为注意力机制：使用 model.layers.12.self_attn.k_proj.weight 等权重
# workspace/lerobot_example/qwen25_config.json里面的attention_moe=False
# 但wall-oss-flow-v0.1/config.json的attention_moe=True
qwen_vl_act_config_path: "/root/gpufree-data/models/x-square-robot/wall-oss-flow-v0.1/config.json"

# Torch Profile
profile: False
profile_save_path: /path/to/profile/
profile_wait_iters: 10
profile_warmup_iters: 5
profile_active_iters: 2

# Training hyperparameters
num_warmup_steps: 300
num_training_steps: 2000
learning_rate: 0.00005
min_lr: 0.000005
num_epoch: 100
gradient_accumulation_steps: 8
batch_size_per_gpu: 4
padding_side: left
epoch_save_interval: 1
val_interval: 30000  # Validate every 1000 iterations

# freeze_vlm: true

