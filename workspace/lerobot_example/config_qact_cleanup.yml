# LoRA configuration
use_lora: false
lora_r: 64
lora_alpha: 64
lora_dropout: 0.1
lora_target_modules:
  - "q_proj_experts.0"
  - "k_proj_experts.0"
  - "v_proj_experts.0"
  - "o_proj_experts.0"
  - "q_proj_experts.1"
  - "k_proj_experts.1"
  - "v_proj_experts.1"
  - "o_proj_experts.1"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# Training optimization settings
FSDP2: false
torch_compile: false # 这个不能为true，貌似跟lora会有冲突，加载模型时key找不到

# Robot configuration - Define degrees of freedom for each component
dof_config:
  shoulder_pan.pos: 1
  shoulder_lift.pos: 1
  elbow_flex.pos: 1
  wrist_flex.pos: 1
  wrist_roll.pos: 1
  gripper.pos: 1

# Agent proprioception configuration (typically matches DOF config)
agent_pos_config:
  shoulder_pan.pos: 1
  shoulder_lift.pos: 1
  elbow_flex.pos: 1
  wrist_flex.pos: 1
  wrist_roll.pos: 1
  gripper.pos: 1

# Checkpoint resuming configuration
resume:
  ckpt: "/root/gpufree-data/models/x-square-robot/wall-oss-flow-v0.1/"
  # ckpt: "/root/gpufree-data/output/train/libero_all/ckpt/0"
  try_harder: true
#   # load_ckpt_only: true

norm_stats_path: "/root/gpufree-data/output/train/so101-table-cleanup/action_stats/all_robots_action_stats.json"

enable_customized_robot_config: true
customized_robot_config:
  name: "so101"
  customized_dof_config:
    "action_all": 6
  customized_agent_pos_config:
    "state_all": 6

# Data configuration
data:
  use_lerobot: true

  # LeRobot dataset configuration
  lerobot_config:
    repo_id: "EverNorif/so101-table-cleanup"
    root: "/root/gpufree-data/datasets/EverNorif/so101-table-cleanup"
    episodes: null
    image_transforms: null
    delta_timestamps: null
    tolerance_s: 1e-4
    revision: null
    force_cache_sync: false
    download_videos: true
    video_backend: null

  action_horizon: 10
  # 这是总的里面取 train_test_split 作为 训练集(95%)+验证集(5%)
  train_test_split: 0.95

  # Action keys for observation and prediction
  obs_action_keys:
    - shoulder_pan.pos
    - shoulder_lift.pos
    - elbow_flex.pos
    - wrist_flex.pos
    - wrist_roll.pos
    - gripper.pos

  predict_action_keys:
    - shoulder_pan.pos
    - shoulder_lift.pos
    - elbow_flex.pos
    - wrist_flex.pos
    - wrist_roll.pos
    - gripper.pos

  # Image resolution configuration for different camera views
  resolution:
    face_view: 224
    left_wrist_view: 224
    right_wrist_view: 224
    move1_view: 224
    move2_view: 224
    top_view: 224
    wall_view: 224
    multi_modal: 224

